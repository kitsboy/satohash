<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; margin:0; background:#0e1c2a; }
  .host { position:absolute; inset:0; }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="91.6"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scenes (track 1) -->
    <div id="host-scene-01" class="host" data-composition-id="scene-01" data-composition-src="compositions/scene-01.html" data-start="0.0" data-duration="5.5" data-track-index="1"></div>
    <div id="host-scene-02" class="host" data-composition-id="scene-02" data-composition-src="compositions/scene-02.html" data-start="5.5" data-duration="15.2" data-track-index="1"></div>
    <div id="host-scene-03" class="host" data-composition-id="scene-03" data-composition-src="compositions/scene-03.html" data-start="20.7" data-duration="8.6" data-track-index="1"></div>
    <div id="host-scene-04" class="host" data-composition-id="scene-04" data-composition-src="compositions/scene-04.html" data-start="29.3" data-duration="17.3" data-track-index="1"></div>
    <div id="host-scene-05" class="host" data-composition-id="scene-05" data-composition-src="compositions/scene-05.html" data-start="46.6" data-duration="16.3" data-track-index="1"></div>
    <div id="host-scene-06" class="host" data-composition-id="scene-06" data-composition-src="compositions/scene-06.html" data-start="62.9" data-duration="15.9" data-track-index="1"></div>
    <div id="host-scene-07" class="host" data-composition-id="scene-07" data-composition-src="compositions/scene-07.html" data-start="78.8" data-duration="8.2" data-track-index="1"></div>
    <div id="host-scene-08" class="host" data-composition-id="scene-08" data-composition-src="compositions/scene-08.html" data-start="87.0" data-duration="4.6" data-track-index="1"></div>

    <!-- Captions (track 3) -->
    <div id="host-captions" class="host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="91.6" data-track-index="3"></div>

    <!-- Narration (track 20) -->
    <audio id="narration" data-start="0" data-duration="91.6" data-track-index="20" src="narration-es.wav" preload="auto"></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Soft cinematic crossfades between scene hosts (transition = entrance).
    const fadeInAt = [
      [0.0, "scene-01"],
      [5.5, "scene-02"],
      [20.7, "scene-03"],
      [29.3, "scene-04"],
      [46.6, "scene-05"],
      [62.9, "scene-06"],
      [78.8, "scene-07"],
      [87.0, "scene-08"]
    ];
    fadeInAt.forEach(([t, id]) => {
      tl.from("#host-" + id, { opacity: 0, duration: 0.8, ease: "sine.inOut" }, t);
    });

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
