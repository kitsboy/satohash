<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Satohash Snapper</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">S<span>H</span></div>
      <h1>Snapper</h1>
    </header>
    
    <div id="status" class="status-box">
      <p>Ready to Stamp</p>
    </div>

    <button id="snapBtn" class="primary-btn">
      <span class="icon">⚡</span> Stamp Current Page
    </button>

    <div class="settings">
      <label>
        <input type="checkbox" id="encryptCheck"> Encrypt Proof (Dark Vault)
      </label>
    </div>

    <footer>
      <p>Secured by Bitcoin Network</p>
    </footer>
  </div>
  <script src="scripts/popup.js"></script>
</body>
</html>
