    <!-- Critical shell so a late CSS fetch never looks "unstyled white" -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #141b25; color: #f1f5f9;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, sans-serif; }

    </style>
    <div id="root"></div>
    <!-- Stale SW recovery: after deploy, old chunks can resolve to index.html and throw Unexpected token '<' -->
    <script>
      (function () {
        function resetClient() {
          try {
            var last = Number(sessionStorage.getItem('satohash_chunk_reset_at') || 0)
            if (Date.now() - last < 15000) return
            sessionStorage.setItem('satohash_chunk_reset_at', String(Date.now()))
          } catch (e) {}
          var jobs = []
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              })
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister() }))
              })
            )
          }
          Promise.all(jobs).finally(function () {
            var u = new URL(location.href)
            u.searchParams.set('_fresh', String(Date.now()))
            location.replace(u.pathname + u.search + u.hash)
          })
        }
        window.addEventListener(
          'error',
          function (e) {
            var msg = String((e && (e.message || (e.error && e.error.message))) || '')
            // HTML-as-JS poison only. Dynamic-import failures must not reload
            // the tab — that flashed "System Desync" on /stamp and /verify.
            if (msg.indexOf("Unexpected token '<'") !== -1) {
              resetClient()
            }
          },
          true
        )
        window.addEventListener('unhandledrejection', function (e) {
          var msg = String((e && e.reason && (e.reason.message || e.reason)) || '')
          if (msg.indexOf("Unexpected token '<'") !== -1) {
            resetClient()
          }
        })
      })()
    </script>
