name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  deploy-with-approval:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for manual approval
        run: echo "This job is gated by the 'staging' environment. Configure required reviewers in repo settings."
name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Security Audit
      run: npm audit --audit-level=moderate
      continue-on-error: true # Don't block build on moderate, but log it
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run Unit Tests
      run: npm run test
      
    - name: Build Vite App
      run: npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Tests
      run: npx playwright test
