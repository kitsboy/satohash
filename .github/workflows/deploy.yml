name: Deploy

# Auto-deploy on every push to main (no dashboard button required).
# Manual re-run still available: Actions → Deploy → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_cloudflare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Job-level env so secrets are visible to steps (step-level if: env.* cannot see step env)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set in repo Actions secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set in repo Actions secrets."
            exit 1
          fi
          echo "Cloudflare secrets present (values never logged)."
      - run: npm ci
      # Public build-time env only (no secrets). Ensures SPA posts to API plane.
      - name: Build SPA
        env:
          VITE_API_URL: https://api.satohash.io
          VITE_MVP_MODE: 'true'
          VITE_APP_NAME: Satohash
          VITE_MEMPOOL_API_URL: https://mempool.space/api
        run: npm run build
      - run: npm run build:verify
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name=satohash

  smoke:
    needs: deploy_cloudflare
    if: needs.deploy_cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Main JS is real JS (not SPA HTML poison)
        run: |
          set -euo pipefail
          INDEX=$(curl -sf "https://satohash.io/?nocache=$RANDOM" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          test -n "$INDEX"
          BODY=$(curl -sf "https://satohash.io/${INDEX}?nocache=$RANDOM" | head -c 80)
          echo "ref=${INDEX} head=${BODY}"
          if echo "$BODY" | grep -qiE '<!doctype|<html'; then
            echo "::error::Production main JS is HTML (edge poison / SPA fallback) — Unexpected token '<'"
            exit 1
          fi
          if ! echo "$BODY" | grep -qE '^(import |const |var |function |/)'; then
            echo "::error::Production main JS does not look like a JS module"
            exit 1
          fi
          # Optional: dedicated Landing chunk still must not have bare .fees.high
          LANDING=$(curl -sf "https://satohash.io/${INDEX}?nocache=$RANDOM" | grep -oE 'Landing-[^"]+\.js' | head -1 || true)
          if [ -n "${LANDING:-}" ]; then
            curl -sf "https://satohash.io/assets/${LANDING}?nocache=$RANDOM" -o /tmp/landing.js
            if grep -qE '\.fees\.high' /tmp/landing.js; then
              echo "::error::Production Landing chunk still has unsafe .fees.high"
              exit 1
            fi
            echo "Landing chunk ${LANDING} ok"
          else
            echo "Landing eager in ${INDEX} — chunk check skipped"
          fi
          echo "Production main JS ok"
      - run: curl -sf https://satohash.giveabit.io/ -o /dev/null || echo "giveabit.io smoke skipped"
