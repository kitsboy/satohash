name: Deploy

# Auto-deploy on every push to main (no dashboard button required).
# Manual re-run still available: Actions → Deploy → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_cloudflare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Job-level env so secrets are visible to steps (step-level if: env.* cannot see step env)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set in repo Actions secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set in repo Actions secrets."
            exit 1
          fi
          echo "Cloudflare secrets present (values never logged)."
      - run: npm ci
      # Public build-time env only (no secrets). Ensures SPA posts to API plane.
      - name: Build SPA
        env:
          VITE_API_URL: https://api.satohash.io
          VITE_MVP_MODE: 'true'
          VITE_APP_NAME: Satohash
          VITE_MEMPOOL_API_URL: https://mempool.space/api
        run: npm run build
      - run: npm run build:verify
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name=satohash

  smoke:
    needs: deploy_cloudflare
    if: needs.deploy_cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Main JS is real JS (not SPA HTML poison)
        run: |
          set -euo pipefail
          # Bundles live under /b/* (not long-cache /assets/*). After Pages deploy,
          # custom-domain edge can briefly serve stale index.html or SPA-fallback HTML
          # for a missing/old chunk — retry before failing the run.
          UA='Mozilla/5.0 (compatible; Satohash-Smoke/1.0)'
          sleep 20
          INDEX=""
          BODY=""
          for i in 1 2 3 4 5 6 7 8; do
            INDEX=$(curl -sfA "$UA" "https://satohash.io/?nocache=${RANDOM}${i}" \
              | grep -oE 'b/index-[^"]+\.js' | head -1 || true)
            if [ -z "$INDEX" ]; then
              echo "attempt $i: no index script in HTML yet"
              sleep 8
              continue
            fi
            # Byte-range only (avoid curl 23 on large bundles)
            if ! curl -sfA "$UA" -r 0-160 "https://satohash.io/${INDEX}?nocache=${RANDOM}${i}" \
              -o /tmp/main-head.bin; then
              echo "attempt $i: JS fetch failed for ${INDEX}"
              sleep 8
              continue
            fi
            BODY=$(cat /tmp/main-head.bin)
            echo "attempt $i: ref=${INDEX} head=$(echo "$BODY" | tr '\n' ' ' | cut -c1-100)"
            if echo "$BODY" | grep -qiE '<!doctype|<html'; then
              echo "attempt $i: HTML-as-JS (stale edge) — retrying"
              sleep 10
              continue
            fi
            if echo "$BODY" | grep -qE '^(import |const |var |function |/)'; then
              echo "Production main JS ok (${INDEX})"
              exit 0
            fi
            echo "attempt $i: unexpected JS head — retrying"
            sleep 8
          done
          echo "::error::Production main JS still HTML or missing after retries — edge poison / SPA fallback"
          echo "last_ref=${INDEX:-none}"
          echo "last_head=${BODY:-empty}"
          exit 1
      - run: curl -sf https://www.satohash.io/ -o /dev/null || echo "www smoke skipped"
