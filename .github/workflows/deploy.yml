name: Deploy

# Auto-deploy on every push to main (no dashboard button required).
# Manual re-run still available: Actions → Deploy → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_cloudflare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Job-level env so secrets are visible to steps (step-level if: env.* cannot see step env)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set in repo Actions secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set in repo Actions secrets."
            exit 1
          fi
          echo "Cloudflare secrets present (values never logged)."
      - run: npm ci
      - run: npm run build
      - run: npm run build:verify
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name=satohash

  smoke:
    needs: deploy_cloudflare
    if: needs.deploy_cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Landing bundle has safe fees access
        run: |
          INDEX=$(curl -sf https://satohash.io/ | grep -oE 'assets/index-[^"]+\.js' | head -1)
          LANDING=$(curl -sf "https://satohash.io/${INDEX}" | grep -oE 'Landing-[^"]+\.js' | head -1)
          curl -sf "https://satohash.io/assets/${LANDING}" -o /tmp/landing.js
          if grep -qE '\.fees\.high' /tmp/landing.js; then
            echo "::error::Production Landing bundle still has unsafe .fees.high — deploy may be stale"
            exit 1
          fi
          echo "Production bundle ${LANDING} ok"
      - run: curl -sf https://satohash.giveabit.io/ -o /dev/null || echo "giveabit.io smoke skipped"
