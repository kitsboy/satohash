name: Deploy

# ONE deployer: the Cloudflare Pages <-> GitHub integration builds and publishes every push to main.
# The duplicate `wrangler pages deploy` step and this repo's CLOUDFLARE_API_TOKEN secret were
# retired 2026-09-11 (see HQ docs/CLOUDFLARE-TOKEN-RETIREMENT.md).
# What is left: build the commit here (early red signal) and verify production actually came back live
# — with no Cloudflare credential of any kind.
# Break-glass (manual ONLY, never on push): Actions -> this workflow -> Run workflow -> mode =
# break-glass-deploy. That job is the single place a token is used and it needs the repo secret
# CLOUDFLARE_PAGES_TOKEN (Pages:Edit, created in the Cloudflare dashboard).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = check production is live (no token); break-glass-deploy = manual wrangler fallback"
        type: choice
        options:
          - verify
          - break-glass-deploy
        default: verify

# One production deploy at a time — overlapping pushes poisoned /b/* chunks
concurrency:
  group: satohash-pages-production
  cancel-in-progress: false

# checks:read — the job waits for the Cloudflare Pages check run on the pushed commit so
# the smoke job starts only once the NEW build is published, not the previous deployment.
permissions:
  contents: read
  checks: read

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Public build-time env only (no secrets). Ensures SPA posts to API plane.
      - name: Build SPA
        env:
          VITE_API_URL: https://api.satohash.io
          VITE_MVP_MODE: 'true'
          VITE_APP_NAME: Satohash
          VITE_MEMPOOL_API_URL: https://mempool.space/api
        run: npm run build
      - run: npm run build:verify
      - name: Wait for the Cloudflare Pages build of ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The CF Pages <-> GitHub integration posts a check run named "Cloudflare Pages" on
          # the pushed commit. Waiting for it is what tells us THIS commit is the one published:
          # the old marker probe below ("Satohash" is present) is also true of the PREVIOUS
          # deployment, so it let the smoke job start mid-rollout while / and /stamp were still
          # served from two different builds (run 34645366777, see t_2e23ea8a).
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
          SAW_CHECK=0
          for attempt in $(seq 1 60); do # ~10 minutes at 10s
            JSON=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" "$API" || echo '{}')
            STATE=$(printf '%s' "$JSON" | jq -r '
              [.check_runs[]? | select(.name == "Cloudflare Pages")]
              | sort_by(.started_at // "") | last
              | if . == null then "absent" else "\(.status) \(.conclusion // "pending")" end' 2>/dev/null || echo absent)
            case "$STATE" in
              "completed success")
                echo "Cloudflare Pages published ${GITHUB_SHA} (attempt ${attempt})"
                SAW_CHECK=1
                break
                ;;
              "completed "*)
                echo "::error::Cloudflare Pages check for ${GITHUB_SHA} finished as '${STATE}'"
                exit 1
                ;;
              *)
                echo "attempt ${attempt}: Cloudflare Pages check is '${STATE}' — waiting"
                ;;
            esac
            sleep 10
          done
          if [ "$SAW_CHECK" != "1" ]; then
            # Never hard-fail on a missing integration signal — fall back to the liveness probe
            # below and let the smoke job's convergence check decide.
            echo "::warning::no completed 'Cloudflare Pages' check run for ${GITHUB_SHA} within ~10 minutes — falling back to the liveness probe"
          fi

      - name: Verify live deploy (CF Pages git integration)
        run: |
          set -euo pipefail
          URL="https://satohash.io/"
          MARKER="Satohash"
          for attempt in $(seq 1 24); do
            HTML=$(curl -fsSL --max-time 20 "$URL" || true)
            printf '%s' "$HTML" > /tmp/prod-page.html
            if [ -s /tmp/prod-page.html ] && grep -q "$MARKER" /tmp/prod-page.html; then
              echo "OK — $URL is answering with marker '$MARKER' (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: production not live yet (CF Pages git build may still be running)"
            sleep 10
          done
          echo "::error::$URL did not serve '$MARKER' within ~4 minutes — check the Cloudflare Pages deployment for $GITHUB_SHA"
          exit 1

  smoke:
    needs: build_and_verify
    if: needs.build_and_verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Production pages smoke
        run: bash scripts/pages-smoke.sh

  # Manual fallback only — cannot race the git integration because it never runs on push.
  break_glass_deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'break-glass-deploy'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build SPA
        env:
          VITE_API_URL: https://api.satohash.io
          VITE_MVP_MODE: 'true'
          VITE_APP_NAME: Satohash
          VITE_MEMPOOL_API_URL: https://mempool.space/api
        run: npm run build
      - run: npm run build:verify
      - name: Require scoped Pages token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::repo secret CLOUDFLARE_PAGES_TOKEN is not set — create a Pages:Edit token in the Cloudflare dashboard and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Scoped Pages token present (value never logged)."
      - name: Deploy to Cloudflare Pages (break-glass, manual only)
        run: npx wrangler pages deploy ./dist --project-name=satohash
