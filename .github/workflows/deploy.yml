name: Deploy

# Auto-deploy on every push to main (no dashboard button required).
# Manual re-run still available: Actions → Deploy → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_cloudflare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Job-level env so secrets are visible to steps (step-level if: env.* cannot see step env)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set in repo Actions secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set in repo Actions secrets."
            exit 1
          fi
          echo "Cloudflare secrets present (values never logged)."
      - run: npm ci
      # Public build-time env only (no secrets). Ensures SPA posts to API plane.
      - name: Build SPA
        env:
          VITE_API_URL: https://api.satohash.io
          VITE_MVP_MODE: 'true'
          VITE_APP_NAME: Satohash
          VITE_MEMPOOL_API_URL: https://mempool.space/api
        run: npm run build
      - run: npm run build:verify
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name=satohash

  smoke:
    needs: deploy_cloudflare
    if: needs.deploy_cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Main JS is real JS (not SPA HTML poison)
        run: |
          set -euo pipefail
          # Bundles are under /b/* (not /assets/*) after apex edge poison
          # Wait briefly for CF custom-domain propagation after deploy
          sleep 15
          INDEX=""
          for i in 1 2 3 4 5; do
            INDEX=$(curl -sf "https://satohash.io/?nocache=$RANDOM$i" | grep -oE '(b|assets)/index-[^"]+\.js' | head -1 || true)
            if [ -n "$INDEX" ]; then break; fi
            sleep 5
          done
          test -n "$INDEX"
          # Use byte-range instead of head|pipefail (curl exit 23)
          curl -sf -r 0-120 "https://satohash.io/${INDEX}?nocache=$RANDOM" -o /tmp/main-head.bin
          BODY=$(cat /tmp/main-head.bin)
          echo "ref=${INDEX} head=${BODY}"
          if echo "$BODY" | grep -qiE '<!doctype|<html'; then
            echo "::error::Production main JS is HTML (edge poison / SPA fallback) — Unexpected token '<'"
            exit 1
          fi
          if ! echo "$BODY" | grep -qE '^(import |const |var |function |/)'; then
            echo "::error::Production main JS does not look like a JS module"
            exit 1
          fi
          echo "Production main JS ok"
      - run: curl -sf https://www.satohash.io/ -o /dev/null || echo "www smoke skipped"
