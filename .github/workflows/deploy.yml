name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_cloudflare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:verify
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ./dist --project-name=satohash
      - name: Fail deploy (no CF token)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN not set — build verified but production deploy skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repo secrets, then re-run this workflow."
          exit 1

  smoke:
    needs: deploy_cloudflare
    if: needs.deploy_cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Landing bundle has safe fees access
        run: |
          INDEX=$(curl -sf https://satohash.io/ | grep -oE 'assets/index-[^"]+\.js' | head -1)
          LANDING=$(curl -sf "https://satohash.io/${INDEX}" | grep -oE 'Landing-[^"]+\.js' | head -1)
          curl -sf "https://satohash.io/assets/${LANDING}" -o /tmp/landing.js
          if grep -qE '\.fees\.high' /tmp/landing.js; then
            echo "::error::Production Landing bundle still has unsafe .fees.high — deploy may be stale"
            exit 1
          fi
          echo "Production bundle ${LANDING} ok"
      - run: curl -sf https://satohash.giveabit.io/ -o /dev/null || echo "giveabit.io smoke skipped"