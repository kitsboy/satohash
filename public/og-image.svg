<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c2a3a;stop-opacity:1" />
    </linearGradient>
    <!-- Gold gradient for main text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0B429;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E09A1A;stop-opacity:1" />
    </linearGradient>
    <!-- Bitcoin circle gradient -->
    <radialGradient id="btcGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C87B00;stop-opacity:1" />
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.8" />
    </pattern>
    <!-- Glow filter for Bitcoin symbol -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow for text -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4" />

  <!-- ── Decorative accent line (top) ── -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#goldGrad)" />

  <!-- ── Left accent: large Bitcoin circle ── -->
  <circle cx="155" cy="315" r="108" fill="#0d1a26" stroke="#F0B429" stroke-width="2" opacity="0.9" />
  <circle cx="155" cy="315" r="92" fill="none" stroke="#F0B429" stroke-width="1" opacity="0.3" />
  <!-- ₿ symbol -->
  <text
    x="155" y="360"
    font-family="Arial, sans-serif"
    font-size="110"
    font-weight="bold"
    fill="url(#btcGrad)"
    text-anchor="middle"
    filter="url(#glow)"
    opacity="0.95">₿</text>

  <!-- ── Right decorative hash lines ── -->
  <g opacity="0.12" stroke="#F0B429" stroke-width="1.2" font-family="'Courier New', monospace" font-size="11" fill="#F0B429">
    <text x="940" y="120">0000000000000000000a2b4c</text>
    <text x="940" y="140">8f3e1d7c9b2a5e0f4d6c8b1a</text>
    <text x="940" y="160">3f7c2e9a1b4d8e0f5c3a7b2d</text>
    <text x="940" y="180">1a4b7c2d5e8f0a3b6c9d2e5f</text>
    <text x="940" y="200">9b2c5d8e1f4a7b0c3d6e9f2a</text>
    <text x="940" y="220">4c7d0e3f6a9b2c5d8e1f4a7b</text>
    <text x="940" y="240">7e0f3a6b9c2d5e8f1a4b7c0d</text>
  </g>

  <!-- ── Main wordmark: SATOHASH ── -->
  <text
    x="310" y="230"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="108"
    font-weight="900"
    font-style="italic"
    fill="url(#goldGrad)"
    filter="url(#textShadow)"
    letter-spacing="6">SATOHASH</text>

  <!-- ── Divider line ── -->
  <rect x="310" y="252" width="620" height="2" fill="url(#goldGrad)" opacity="0.6" rx="1" />

  <!-- ── Primary tagline ── -->
  <text
    x="310" y="310"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="30"
    font-weight="600"
    fill="#FFFFFF"
    letter-spacing="1"
    filter="url(#textShadow)">Prove Your Documents Exist. Forever. On Bitcoin.</text>

  <!-- ── Feature pills ── -->
  <!-- Pill 1: Bitcoin Anchored -->
  <rect x="310" y="345" width="188" height="34" rx="17" fill="#F0B429" opacity="0.15" stroke="#F0B429" stroke-width="1" />
  <text x="404" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F0B429" text-anchor="middle" letter-spacing="0.5">Bitcoin Anchored</text>

  <!-- Pill 2: OpenTimestamps -->
  <rect x="508" y="345" width="188" height="34" rx="17" fill="#F0B429" opacity="0.15" stroke="#F0B429" stroke-width="1" />
  <text x="602" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F0B429" text-anchor="middle" letter-spacing="0.5">OpenTimestamps</text>

  <!-- Pill 3: Court-Ready Proof -->
  <rect x="706" y="345" width="188" height="34" rx="17" fill="#F0B429" opacity="0.15" stroke="#F0B429" stroke-width="1" />
  <text x="800" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F0B429" text-anchor="middle" letter-spacing="0.5">Court-Ready Proof</text>

  <!-- ── Subtitle ── -->
  <text
    x="310" y="430"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="20"
    font-weight="400"
    fill="#8BACC8"
    letter-spacing="0.3">Immutable proof of existence • Under 60 minutes • Free forever</text>

  <!-- ── Bottom strip ── -->
  <rect x="0" y="560" width="1200" height="70" fill="#0a1018" opacity="0.8" />
  <!-- Domain -->
  <text
    x="310" y="603"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="18"
    font-weight="400"
    fill="#8BACC8"
    letter-spacing="1">satohash.com</text>
  <!-- Right: trust badges text -->
  <text
    x="890" y="603"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="14"
    font-weight="400"
    fill="#F0B429"
    text-anchor="end"
    letter-spacing="0.5">ESIGN Act • eIDAS • Zero-Knowledge • No Registration Required</text>

  <!-- ── Decorative corner accent ── -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#goldGrad)" opacity="0.5" />
</svg>
